spring.application.name=notify
server.port=8004
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket?currentSchema=notify_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=notify_schema
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Đảm bảo schema được tạo nếu chưa tồn tại
spring.sql.init.mode=always