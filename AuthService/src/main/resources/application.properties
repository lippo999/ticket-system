spring.application.name=authservice
server.port=8001

# Database Configuration - Sử dụng user riêng cho AuthService
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket?currentSchema=auth_schema
spring.datasource.username=auth_user
spring.datasource.password=auth_password_123

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=auth_schema
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Đảm bảo schema được tạo nếu chưa tồn tại
spring.sql.init.mode=always