spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket
    username: event_user
    password: event_password_123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: event_schema
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083

# SpringDoc Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false  # Disable local Swagger UI, chỉ dùng centralized tại Gateway

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
